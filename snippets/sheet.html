<!-- 설정 시트 HTML (weight-note v1.0.5에서 그대로). 버튼 id와 항목은 앱에 맞게 바꾼다. -->

<!-- 헤더 오른쪽 톱니 버튼 (Lucide "settings", 선 굵기 2) -->
<button class="iconbtn" id="menuBtn" aria-label="설정"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>

<!-- 어두운 배경 + 설정 시트 (body 맨 아래쪽에 둔다) -->
<div class="backdrop" id="setBd"></div>
<div class="sheet set" id="setSheet" role="dialog" aria-label="설정">
  <div class="handle"></div>
  <div class="date-lab">설정</div>
  <div class="grp">데이터</div>
  <button class="srow" id="exportBtn">데이터 백업 (내보내기)</button>
  <button class="srow" id="importBtn">데이터 복원 (불러오기)</button>
  <div class="grp">다른 그룹 이름</div>
  <button class="srow" id="otherBtn">항목 이름<span class="msub">작은 설명(선택)</span></button>
  <div class="ver">v1.0.5</div> <!-- 배포할 때마다 버전 올리기 -->
</div>

<script>
/* 열기/닫기는 back.js의 ovOpen / ovClose를 쓴다. */
const setBd=document.getElementById("setBd"), setSheet=document.getElementById("setSheet");
function hideSettings(){ setBd.classList.remove("show"); setSheet.classList.remove("show"); }
function closeSettings(){ ovClose("settings"); }
document.getElementById("menuBtn").onclick=()=>{
  ovOpen("settings",()=>{ setBd.classList.add("show"); setSheet.classList.add("show"); },hideSettings);
};
setBd.onclick=closeSettings; // 바깥 터치로 닫아도 뒤로가기 기록이 쌓이지 않는다
</script>
